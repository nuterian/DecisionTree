<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Paste a table, leave a blank, and see the decision tree that answers it.">
  <title>Decision Tree</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Decision Tree</h1>
      <p>Paste a table. Leave a blank. Ask why.</p>
    </header>

    <section class="card" id="data">
      <div class="chips" id="sets"></div>
      <textarea id="csv" spellcheck="false" placeholder="Paste or drop a CSV. The first row names the columns."></textarea>
      <div class="bar">
        <span id="status" class="status" role="status"></span>
        <input id="name" placeholder="Name" aria-label="Data set name">
        <button id="save" type="button">Save</button>
      </div>
    </section>

    <div id="model" hidden>
      <section>
        <h2>Predict</h2>
        <div id="picker" class="chips" role="radiogroup" aria-label="Column to predict"></div>
        <p class="hint">Percentages are cross-validated accuracy at predicting that column from the others.</p>
      </section>

      <section class="ask">
        <form id="query" autocomplete="off"></form>
        <div id="answer" class="card answer" aria-live="polite"></div>
      </section>

      <section class="split">
        <div>
          <h2>Tree</h2>
          <ul id="tree" class="tree"></ul>
        </div>
        <aside>
          <h2>What matters</h2>
          <div id="importance" class="bars"></div>
          <details id="rules-box">
            <summary>Rules</summary>
            <ol id="rules" class="rules"></ol>
          </details>
        </aside>
      </section>
    </div>

    <footer>Built with <a href="https://github.com/nuterian/ditify">ditify</a> · Jugal Manjeshwar</footer>
  </main>
</body>
</html>
